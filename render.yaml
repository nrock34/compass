# Repository root is rwm-strapi/, not its former parent repository.
databases:
  - name: rwm-strapi-postgres
    plan: basic-256mb
    databaseName: rwm_strapi
    user: rwm_strapi
    ipAllowList: []

services:
  - type: keyvalue
    name: rwm-strapi-cache
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: rwm-strapi
    runtime: docker
    plan: standard
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    domains:
      - strapi.romewithme.com
      - providers.romewithme.com
    healthCheckPath: /_health
    preDeployCommand: node scripts/prepare-database.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: IS_PROXIED
        value: "true"
      - key: ADMIN_URL
        value: /
      - key: PUBLIC_URL
        value: https://strapi.romewithme.com
      - key: CORS_ORIGIN
        sync: false
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: rwm-strapi-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: DATABASE_FORCE_MIGRATION
        value: "false"
      - key: CACHE_REDIS_URL
        fromService:
          type: keyvalue
          name: rwm-strapi-cache
          property: connectionString
      - key: CACHE_REDIS_KEY_PREFIX
        value: "rwm:strapi-cache:"
      - key: UP_COOKIE_SECURE
        value: "true"
      - key: UP_COOKIE_SAME_SITE
        value: lax
      - key: CATALOG_EDITOR_ENABLED
        value: "true"
      - key: CATALOG_EDITOR_PUBLIC_ORIGIN
        value: https://providers.romewithme.com
      # Persistent uploads use R2, not the container's ephemeral filesystem.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BASE
        sync: false
