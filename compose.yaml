name: rwm-strapi

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${STRAPI_DATABASE_NAME:-rwm_strapi}
      POSTGRES_USER: ${STRAPI_DATABASE_USERNAME:-rwm_strapi}
      POSTGRES_PASSWORD: ${STRAPI_DATABASE_PASSWORD:-rwm-strapi-local-password}
    ports:
      - "${POSTGRES_PORT:-54325}:5432"
    volumes:
      - strapi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-rwm-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-rwm-minio-local-password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - strapi-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" &&
        mc mb --ignore-existing local/rwm-media &&
        mc anonymous set download local/rwm-media
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-rwm-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-rwm-minio-local-password}


  strapi:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${STRAPI_DATABASE_NAME:-rwm_strapi}
      DATABASE_USERNAME: ${STRAPI_DATABASE_USERNAME:-rwm_strapi}
      DATABASE_PASSWORD: ${STRAPI_DATABASE_PASSWORD:-rwm-strapi-local-password}
      DATABASE_FORCE_MIGRATION: "false"
      CACHE_REDIS_HOST: redis
      CACHE_REDIS_PORT: 6379
      CACHE_REDIS_DB: 0
      CACHE_REDIS_KEY_PREFIX: "rwm:strapi-cache:"
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-rwm-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rwm-minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rwm-minio-local-password}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_BASE: ${S3_PUBLIC_BASE:-http://localhost:9000/rwm-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      IS_PROXIED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${STRAPI_PORT:-1337}:1337"

volumes:
  strapi-minio-data:
  strapi-postgres-data:
